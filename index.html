<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origami Soccer Ball - Under Construction</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#2b2b2b;color:#ffd400;font-family:"Courier New",monospace;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;position:relative}
  .tape{position:fixed;left:-10%;width:120%;height:56px;display:flex;align-items:center;justify-content:center;
    font-weight:bold;letter-spacing:.3em;color:#111;font-size:20px;
    background:repeating-linear-gradient(-45deg,#ffd400 0 28px,#111 28px 56px);box-shadow:0 4px 10px #0008}
  .tape span{background:#ffd400;padding:4px 18px}
  .t1{top:40px;transform:rotate(-4deg)}
  .t2{bottom:40px;transform:rotate(3deg)}
  h1{font-size:clamp(2rem,7vw,4.5rem);margin:0 0 .2em;text-align:center;text-shadow:3px 3px #000}
  p{color:#ddd;margin:0 0 1rem;text-align:center}
  svg{width:min(320px,70vw);height:auto;animation:bob 1s ease-in-out infinite alternate}
  #hammer{transform-origin:236px 150px;animation:tw .5s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-8px)}}
  @keyframes tw{from{transform:rotate(-20deg)}to{transform:rotate(15deg)}}
</style>
</head>
<body>
<div class="tape t1"><span>UNDER CONSTRUCTION</span></div>
<h1>Under Construction</h1>
<p>The origami soccer ball is being assembled. Check back soon!</p>
<svg viewBox="0 0 300 300" role="img" aria-label="Monkey with a hard hat and screwdriver">
  <!-- body -->
  <ellipse cx="150" cy="245" rx="55" ry="50" fill="#8b5a2b"/>
  <ellipse cx="150" cy="255" rx="32" ry="34" fill="#e0b787"/>
  <!-- ears -->
  <circle cx="92" cy="140" r="22" fill="#8b5a2b"/><circle cx="92" cy="140" r="12" fill="#e0b787"/>
  <circle cx="208" cy="140" r="22" fill="#8b5a2b"/><circle cx="208" cy="140" r="12" fill="#e0b787"/>
  <!-- head -->
  <circle cx="150" cy="140" r="58" fill="#8b5a2b"/>
  <ellipse cx="150" cy="160" rx="38" ry="32" fill="#e0b787"/>
  <circle cx="132" cy="130" r="9" fill="#fff"/><circle cx="168" cy="130" r="9" fill="#fff"/>
  <circle cx="134" cy="132" r="4" fill="#000"/><circle cx="170" cy="132" r="4" fill="#000"/>
  <ellipse cx="143" cy="158" rx="3" ry="4" fill="#5a3a1a"/><ellipse cx="157" cy="158" rx="3" ry="4" fill="#5a3a1a"/>
  <path d="M130 174 Q150 190 170 174" stroke="#5a3a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- hard hat -->
  <path d="M92 108 Q150 40 208 108 Z" fill="#ffd400" stroke="#b39600" stroke-width="3"/>
  <rect x="140" y="62" width="20" height="40" rx="4" fill="#ffe34d" stroke="#b39600" stroke-width="2"/>
  <rect x="82" y="104" width="136" height="12" rx="6" fill="#ffd400" stroke="#b39600" stroke-width="3"/>
  <!-- left arm -->
  <path d="M105 215 Q70 230 80 262" stroke="#8b5a2b" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- right arm + screwdriver -->
  <g id="hammer">
    <path d="M195 215 Q232 200 236 150" stroke="#8b5a2b" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="236" cy="148" r="11" fill="#8b5a2b"/>
    <rect x="231" y="96" width="10" height="46" rx="4" fill="#e53935"/>
    <rect x="234" y="62" width="4" height="36" fill="#bbb"/>
    <rect x="232" y="58" width="8" height="6" fill="#888"/>
  </g>
  <!-- tail -->
  <path d="M100 265 Q50 280 45 235 Q42 215 62 220" stroke="#8b5a2b" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
<div class="tape t2"><span>UNDER CONSTRUCTION</span></div>
</body>
</html>
